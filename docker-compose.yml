version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: signalbot_db
    environment:
      POSTGRES_DB: signalbot
      POSTGRES_USER: ${POSTGRES_USER:-botuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botuser} -d signalbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    container_name: signalbot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-botuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/signalbot
    volumes:
      - ./logs:/app/logs
      - ./${TELEGRAM_SESSION_NAME:-signal_bot}.session:/app/${TELEGRAM_SESSION_NAME:-signal_bot}.session
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "bot", "run"]

volumes:
  postgres_data:
