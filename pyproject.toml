[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vooi-signal-bot"
version = "1.0.0"
description = "VOOI Signal Bot — automated crypto trading bot"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36.0",
    "openai>=1.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.7.0",
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
bot = "bot.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bot"]
